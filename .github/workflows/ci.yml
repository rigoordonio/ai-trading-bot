name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt hypothesis mypy pandas-stubs types-PyYAML types-requests
      - name: lint
        run: ruff check src tests scripts
      - name: type check
        run: mypy src
      - name: unit tests
        run: pytest -m "not integration and not slow" --cov=src --cov-report=term-missing
      - name: integration tests
        run: pytest -m "integration" --cov=src --cov-append --cov-report=term-missing --cov-report=xml
      - name: coverage gate on trading-critical modules
        run: >
          coverage report --fail-under=85
          --include="src/risk/*,src/execution/orders.py,src/execution/order_manager.py,src/execution/simulator.py,src/execution/paper_broker.py,src/portfolio/portfolio.py,src/safety/*,src/data/validator.py"
