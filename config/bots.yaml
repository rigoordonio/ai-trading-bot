# Three independent bots on one platform.
#
# Each bot has its OWN features, strategy components, ML target/model, risk
# overrides (merged over risk.yaml), capital sleeve and versions. Shared:
# data, validation, feature framework, risk framework, order manager, broker,
# database, dashboard.
#
# All thresholds below are starting HYPOTHESES. Validate them with
# walk-forward testing (scripts/walk_forward.py), never on the test period.

bots:
  SWING_V1:
    enabled: true
    description: "Short-term momentum, breakouts and controlled mean reversion"
    strategy_version: "1.0.0"
    timeframe: daily
    holding_horizon_days: [5, 20]
    capital_allocation: 0.30          # share of total account equity
    rebalance_frequency: daily
    symbols: null                      # null = shared universe
    features:
      return_windows: [1, 5, 10, 20]
      sma_windows: [10, 20, 50]
      ema_windows: [12, 26]
      rsi_window: 14
      macd: {fast: 12, slow: 26, signal: 9}
      atr_window: 14
      realized_vol_windows: [20]
      volume_window: 20
      bollinger: {window: 20, num_std: 2.0}
      dist_high_windows: [20]
      breakout_window: 20
      extra_breakout_windows: [10]
    components:
      short_momentum:
        type: momentum
        weight: 0.25
        entry_threshold: 0.67
        params: {windows: [5, 10], risk_adjusted: false, top_n: 3, require_positive_momentum: true}
      breakout_20d:
        type: breakout
        weight: 0.20
        entry_threshold: 1.0
        params: {lookback: 20, exit_lookback: 10, volume_ratio_min: 1.5, require_trend: true}
      mean_reversion:
        type: mean_reversion
        weight: 0.15
        entry_threshold: 0.5
        params: {rsi_threshold: 30, zscore_threshold: -2.0, max_holding_days: 10, require_long_term_uptrend: true}
      volume_confirmation:
        type: volume_confirmation
        weight: 0.10
        entry_threshold: 1.0
        params: {min_ratio: 1.3, short_sma: 20}
    ml:
      enabled: true
      weight: 0.30
      model_version: "swing-ml-1"
      target_horizon_days: 5
      target_threshold: 0.01           # forward 5d return must beat +1% (not 0: costs)
      models: [logistic_regression, random_forest, gradient_boosting]
      probability_floor: 0.5
      probability_cap: 0.70
      features: [ret_1d, ret_5d, ret_10d, ret_20d, rsi_14, macd_pct, atr_pct, bb_pct, zscore_20,
                 realized_vol_20, volume_ratio, volume_zscore, dist_high_20, dist_sma_50,
                 mkt_trend, mkt_ret_20d, mkt_vol_20, breadth_50]
    thresholds: {buy: 0.60, hold: 0.40, exit: 0.25, reduce_fraction: 0.5}
    risk:
      position_sizing: {method: atr, atr_risk_per_trade: 0.0075, atr_stop_multiple: 2.0}
      limits: {max_position_weight: 0.25, max_concurrent_positions: 5}
      stops: {enabled: true, fixed_stop_pct: 0.06, trailing_atr_multiple: 2.0, max_holding_days: 30}

  TREND_V1:
    enabled: true
    description: "Sustained medium-term trends (1-3 months)"
    strategy_version: "1.0.0"
    timeframe: daily
    holding_horizon_days: [20, 60]
    capital_allocation: 0.40
    rebalance_frequency: weekly
    symbols: null
    features:
      return_windows: [5, 20, 60]
      sma_windows: [20, 50, 100, 200]
      ema_windows: [20, 50]
      rsi_window: 14
      macd: {fast: 12, slow: 26, signal: 9}
      atr_window: 14
      realized_vol_windows: [20, 60]
      volume_window: 20
      high_52w_window: 252
      breakout_window: 55
      extra_breakout_windows: [20]
    components:
      long_trend:
        type: trend_following
        weight: 0.35
        entry_threshold: 1.0
        params: {fast_sma: 50, slow_sma: 200, momentum_window: 60}
      medium_trend:
        type: trend_following
        weight: 0.15
        entry_threshold: 1.0
        params: {fast_sma: 20, slow_sma: 100, momentum_window: 20}
      relative_momentum:
        type: momentum
        weight: 0.25
        entry_threshold: 0.67
        params: {windows: [20, 60], risk_adjusted: true, top_n: 4, require_positive_momentum: true}
    ml:
      enabled: true
      weight: 0.25
      model_version: "trend-ml-1"
      target_horizon_days: 40
      target_threshold: 0.02
      models: [logistic_regression, random_forest, gradient_boosting]
      probability_floor: 0.5
      probability_cap: 0.70
      features: [ret_5d, ret_20d, ret_60d, rsi_14, macd_pct, atr_pct, realized_vol_20, realized_vol_60,
                 dist_52w_high, dist_sma_50, dist_sma_200, risk_adj_mom_60, volume_ratio,
                 mkt_trend, mkt_vol_20, breadth_50]
    thresholds: {buy: 0.65, hold: 0.45, exit: 0.30, reduce_fraction: 0.5}
    risk:
      position_sizing: {method: volatility, target_position_vol: 0.15}
      limits: {max_position_weight: 0.25, max_concurrent_positions: 6}
      stops: {enabled: true, fixed_stop_pct: 0.12, trailing_atr_multiple: 3.5, max_holding_days: null}

  LONGTERM_V1:
    enabled: true
    description: "Long-term investor on weekly candles (3-12 months)"
    strategy_version: "1.0.0"
    timeframe: weekly
    holding_horizon_days: [63, 252]
    capital_allocation: 0.30
    rebalance_frequency: weekly
    symbols: null
    features:                          # DAILY features (risk, liquidity, stops)
      return_windows: [1, 20]
      sma_windows: [50, 200]
      ema_windows: []
      atr_window: 14
      realized_vol_windows: [20]
      volume_window: 20
    weekly_features:                   # WEEKLY features -> columns prefixed w_
      return_windows: [1, 4, 13, 26, 52]
      sma_windows: [10, 40]
      ema_windows: [10]
      rsi_window: 14
      atr_window: 14
      realized_vol_windows: [13, 26]
      volume_window: 10
      bollinger: {window: 20, num_std: 2.0}
      high_52w_window: 52
      breakout_window: 26
      extra_breakout_windows: [13]
      periods_per_year: 52
    components:
      lt_momentum:
        type: long_term_momentum
        weight: 0.30
        entry_threshold: 0.6
        params: {long_window: 52, skip_window: 4, prefix: "w_"}
      weekly_trend:
        type: trend_following
        weight: 0.25
        entry_threshold: 1.0
        params: {fast_sma: 10, slow_sma: 40, momentum_window: 13, prefix: "w_"}
      low_volatility:
        type: low_volatility
        weight: 0.10
        entry_threshold: 0.5
        params: {vol_window: 26, prefix: "w_"}
      drawdown_filter:
        type: drawdown_filter
        weight: 0.10
        entry_threshold: 0.5
        params: {max_drawdown: 0.20, prefix: "w_"}
    ml:
      enabled: true
      weight: 0.25
      model_version: "longterm-ml-1"
      target_horizon_days: 63          # ~13 weeks
      target_threshold: 0.03
      models: [logistic_regression, random_forest, gradient_boosting]
      probability_floor: 0.5
      probability_cap: 0.70
      features: [w_ret_4d, w_ret_13d, w_ret_26d, w_ret_52d, w_rsi_14, w_realized_vol_13, w_realized_vol_26,
                 w_dist_52w_high, w_atr_pct, w_volume_ratio, mkt_trend, mkt_vol_20, breadth_50]
    thresholds: {buy: 0.60, hold: 0.40, exit: 0.25, reduce_fraction: 0.5}
    risk:
      position_sizing: {method: fixed_fractional, fixed_fraction: 0.12}
      limits: {max_position_weight: 0.20, max_concurrent_positions: 8}
      stops: {enabled: true, fixed_stop_pct: 0.20, trailing_atr_multiple: null, max_holding_days: null}
