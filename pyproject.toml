[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "AI-assisted quantitative trading research platform (backtest / simulation / paper trading only)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6.0",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy>=2.0",
    "yfinance>=0.2.40",
    "requests>=2.31",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.3"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dashboard = ["streamlit>=1.36", "plotly>=5.20"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.4", "mypy>=1.10", "matplotlib>=3.8",
       "pandas-stubs", "types-PyYAML", "types-requests"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "unit: fast, isolated tests (default)",
    "integration: multi-component pipeline tests (data -> ... -> paper broker -> database)",
    "slow: long-running tests (full backtests, walk-forward)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]
omit = ["src/dashboard/app.py"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "BLE"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"src/dashboard/kpi_page.py" = ["E501"]   # embedded HTML/CSS/JS template
